<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Hub</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #1b2430; }
    .card { background: #fff; padding: 32px 40px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; max-width: 460px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 6px 0; color: #566273; }
    #status { margin-top: 18px; font-weight: 600; direction: ltr; unicode-bidi: plaintext; }
    .ok { color: #1a7f4b; } .bad { color: #b3261e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sales Hub</h1>
    <p>نظام تقارير المبيعات</p>
    <p>(قيد الإعداد)</p>
    <div id="status">جاري فحص الاتصال بـ Supabase...</div>
  </div>
  <script src="config.js?v=2"></script>
  <script>
    (async () => {
      const el = document.getElementById("status");
      const fail = (msg) => { el.textContent = "تعذّر الاتصال ❌ " + msg; el.className = "bad"; };
      try {
        const cfg = window.SALES_HUB_CONFIG;
        if (!cfg) return fail("config.js لم يتحمّل");
        const ctrl = new AbortController();
        const timer = setTimeout(() => ctrl.abort(), 10000);
        const r = await fetch(cfg.SUPABASE_URL + "/auth/v1/health", {
          headers: { apikey: cfg.SUPABASE_ANON_KEY },
          signal: ctrl.signal,
        });
        clearTimeout(timer);
        if (r.ok) {
          el.textContent = "الاتصال بـ Supabase شغال ✅";
          el.className = "ok";
        } else {
          fail("HTTP " + r.status);
        }
      } catch (e) {
        fail(e.name === "AbortError" ? "انتهت المهلة (10 ثواني)" : e.message);
      }
    })();
  </script>
</body>
</html>
