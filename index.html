<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Hub</title>
  <link rel="icon" href="data:," />
  <link rel="stylesheet" href="styles.css?v=4" />
</head>
<body>
  <div id="boot" class="center"><p class="muted">Loading...</p></div>

  <main id="login-view" class="center" hidden>
    <form id="login-form" class="card" autocomplete="on">
      <h1>Sales Hub</h1>
      <p class="muted">Sales reporting system</p>
      <label for="email">Email</label>
      <input id="email" name="email" type="email" autocomplete="username" required />
      <label for="password">Password</label>
      <input id="password" name="password" type="password" autocomplete="current-password" required />
      <button id="login-btn" type="submit">Sign in</button>
      <p id="login-error" class="error" role="alert"></p>
    </form>
  </main>

  <div id="app-view" hidden>
    <header class="topbar">
      <div class="brand">Sales Hub</div>
      <div class="who">
        <span id="who" class="muted"></span>
        <button id="signout" type="button" class="ghost">Sign out</button>
      </div>
    </header>
    <main class="content">
      <h2>Mapping</h2>
      <p id="app-error" class="error" role="alert"></p>
      <div id="tabs" class="tabs" role="tablist"></div>
      <div id="stats" class="stats"></div>
      <input id="search" type="search" placeholder="Search box, district, rep or manager" aria-label="Search" />
      <div class="table-wrap">
        <table id="boxes">
          <thead>
            <tr><th>Box</th><th>District</th><th>Region</th><th>Rep</th><th>Manager</th><th class="num">Bricks</th></tr>
          </thead>
          <tbody id="boxes-body"></tbody>
        </table>
      </div>
      <p id="empty" class="muted" hidden>No boxes match your search.</p>
    </main>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=4"></script>
  <script src="app.js?v=4"></script>
</body>
</html>
