<!doctype html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sales Hub</title>
  <style>
    body { font-family: system-ui, "Segoe UI", Tahoma, sans-serif; margin: 0; min-height: 100vh; display: grid; place-items: center; background: #f5f7fa; color: #1b2430; }
    .card { background: #fff; padding: 32px 40px; border-radius: 14px; box-shadow: 0 4px 20px rgba(0,0,0,.08); text-align: center; max-width: 420px; }
    h1 { margin: 0 0 8px; font-size: 26px; }
    p { margin: 6px 0; color: #566273; }
    #status { margin-top: 18px; font-weight: 600; }
    .ok { color: #1a7f4b; } .bad { color: #b3261e; }
  </style>
</head>
<body>
  <div class="card">
    <h1>Sales Hub</h1>
    <p>نظام تقارير المبيعات</p>
    <p>(قيد الإعداد)</p>
    <div id="status">جاري فحص الاتصال بـ Supabase...</div>
  </div>
  <script src="config.js"></script>
  <script>
    (async () => {
      const el = document.getElementById("status");
      const { SUPABASE_URL, SUPABASE_ANON_KEY } = window.SALES_HUB_CONFIG;
      try {
        const r = await fetch(SUPABASE_URL + "/rest/v1/", { headers: { apikey: SUPABASE_ANON_KEY } });
        if (r.ok || r.status === 401 || r.status === 404) {
          el.textContent = "الاتصال بـ Supabase شغال ✅";
          el.className = "ok";
        } else {
          throw new Error("HTTP " + r.status);
        }
      } catch (e) {
        el.textContent = "تعذّر الاتصال بـ Supabase ❌ (" + e.message + ")";
        el.className = "bad";
      }
    })();
  </script>
</body>
</html>
